  <text x="210" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Students</text>
  
  <!-- Supervisors -->
  <rect x="320" y="125" width="120" height="25" rx="5" fill="#10B981" />
  <text x="380" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Supervisors</text>
  
  <!-- Admin -->
