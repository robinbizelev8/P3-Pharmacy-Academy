  <text x="1035" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">External Resources</text>
  
  <rect x="940" y="590" width="190" height="130" rx="5" fill="white" stroke="#6B7280"/>
  <text x="1035" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2937">Singapore Healthcare</text>
  <text x="950" y="630" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• MOH Clinical Guidelines</text>
  <text x="950" y="645" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• HSA Drug Information</text>
  <text x="950" y="660" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• SPC Requirements</text>
  <text x="950" y="675" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Competency Standards</text>
  <text x="950" y="690" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Evidence-based Content</text>
  <text x="950" y="705" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• 7 Therapeutic Areas</text>
  
  <!-- Data Flow Arrows -->
  <!-- User to Frontend -->
  <path d="M 600 160 L 600 180" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Frontend to Backend -->
  <path d="M 600 250 L 650 250" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Backend to Database -->
  <path d="M 670 390 L 250 540" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Backend to AI -->
  <path d="M 900 390 L 690 540" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Backend to External -->
  <path d="M 1000 390 L 1035 540" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
  
  <!-- Key Features Box -->
  <rect x="50" y="780" width="1100" height="100" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="600" y="805" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">Key Platform Features</text>
  <text x="70" y="825" font-family="Arial, sans-serif" font-size="12" fill="#15803D">• Three-Stage Learning: Prepare → Practice → Perform</text>
  <text x="70" y="845" font-family="Arial, sans-serif" font-size="12" fill="#15803D">• Dynamic Clinical Scenarios across 7 Therapeutic Areas</text>
  <text x="70" y="865" font-family="Arial, sans-serif" font-size="12" fill="#15803D">• Real-time AI Coaching with Structured Feedback (Feedback, Model Answer, Learning Tip)</text>
  
  <text x="650" y="825" font-family="Arial, sans-serif" font-size="12" fill="#15803D">• Multi-language Support (10 Southeast Asian Languages)</text>
  <text x="650" y="845" font-family="Arial, sans-serif" font-size="12" fill="#15803D">• Singapore Pre-registration Training Compliance</text>
  <text x="650" y="865" font-family="Arial, sans-serif" font-size="12" fill="#15803D">• Comprehensive Portfolio Development & Progress Tracking</text>
</svg>