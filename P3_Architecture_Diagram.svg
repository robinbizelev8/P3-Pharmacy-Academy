  <text x="260" y="290" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• React Context</text>
  <text x="260" y="305" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• TanStack Query</text>
  <text x="260" y="320" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Session State</text>
  <text x="260" y="335" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Server State</text>
  
