  <text x="325" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2937">Frontend (React 18 + TypeScript)</text>
  
  <!-- React Components -->
  <rect x="70" y="250" width="160" height="120" rx="5" fill="white" stroke="#3B82F6"/>
  <text x="150" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2937">UI Components</text>
  <text x="80" y="290" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Shadcn/ui (Radix)</text>
  <text x="80" y="305" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Tailwind CSS</text>
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Custom Design System</text>
  <text x="80" y="335" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Progressive Disclosure</text>
  <text x="80" y="350" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Accessibility Focus</text>
  
