  <text x="680" y="430" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Replit Auth Integration • PostgreSQL Session Store (connect-pg-simple)</text>
  <text x="680" y="445" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Multi-stage Training Progress Auto-save • Secure JWT Token Management</text>
  <text x="680" y="460" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Role-based Access (Student/Supervisor/Admin) • Singapore Healthcare Authority Compliance</text>
  
