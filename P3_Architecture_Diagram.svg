  <text x="900" y="290" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Competency Assessment Engine</text>
  <text x="900" y="305" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Progress Tracking System</text>
  <text x="900" y="320" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Portfolio Development</text>
  <text x="900" y="335" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Clinical Scenario Generation</text>
  <text x="900" y="350" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Multi-stage Training Support</text>
  
