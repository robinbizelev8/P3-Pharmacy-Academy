  <rect x="710" y="590" width="160" height="130" rx="5" fill="white" stroke="#F59E0B"/>
  <text x="790" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2937">Claude AI + Sealion</text>
  <text x="720" y="630" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Multi-language Support</text>
  <text x="720" y="645" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• SEA Language Processing</text>
  <text x="720" y="660" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Structured Feedback</text>
  <text x="720" y="675" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Model Answers</text>
  <text x="720" y="690" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Learning Tips</text>
  <text x="720" y="705" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Cultural Context</text>
  
  <!-- External Services -->
