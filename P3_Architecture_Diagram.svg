  <text x="440" y="290" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Wouter (Client Routing)</text>
  <text x="440" y="305" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• React Hook Form</text>
  <text x="440" y="320" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Zod Validation</text>
  <text x="440" y="335" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Type Safety</text>
  
