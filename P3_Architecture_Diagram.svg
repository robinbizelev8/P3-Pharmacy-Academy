  <text x="80" y="645" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Users & Roles</text>
  <text x="80" y="660" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Competency Assessments</text>
  <text x="80" y="675" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Learning Resources</text>
  <text x="80" y="690" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Progress Tracking</text>
  <text x="80" y="705" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Sessions & Messages</text>
  
