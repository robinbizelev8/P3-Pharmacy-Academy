  <rect x="510" y="590" width="180" height="130" rx="5" fill="white" stroke="#F59E0B"/>
  <text x="600" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2937">OpenAI GPT-4o</text>
  <text x="520" y="630" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Clinical Coaching</text>
  <text x="520" y="645" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Dynamic Case Generation</text>
  <text x="520" y="660" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Real-time Feedback</text>
  <text x="520" y="675" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Therapeutic Area Focus</text>
  <text x="520" y="690" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Medical Accuracy</text>
  <text x="520" y="705" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Singapore Standards</text>
  
