  <text x="680" y="290" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• TypeScript + ES Modules</text>
  <text x="680" y="305" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Structured Error Handling</text>
  <text x="680" y="320" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• JWT Authentication</text>
