  <text x="280" y="630" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Type-safe Operations</text>
  <text x="280" y="645" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Schema Validation</text>
  <text x="280" y="660" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Migration Management</text>
  <text x="280" y="675" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Competency Analytics</text>
  <text x="280" y="690" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Portfolio Tracking</text>
  <text x="280" y="705" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Real-time Queries</text>
  
