  <text x="80" y="430" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Vite (Build Tool & Dev Server) • TypeScript (Type Safety) • Hot Module Replacement (HMR)</text>
  <text x="80" y="445" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Server-Side Rendering (SSR) • Progressive Web App (PWA) Ready • Multi-language Support (10 SEA Languages)</text>
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">• Three-Stage Learning Framework: Prepare → Practice → Perform</text>
  
